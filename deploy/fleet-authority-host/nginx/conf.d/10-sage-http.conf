map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=fleet_enrollment:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fleet_device:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=fleet_admin:10m rate=120r/m;

# The call relay keeps owning its call.sage.delivery certificate and ACME
# lifecycle. Port 80 is forwarded to its loopback HTTP listener.
server {
    listen 80;
    listen [::]:80;
    server_name call.sage.delivery;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://127.0.0.1:8080;
    }
}

# certbot uses this webroot before the fleet TLS listener is enabled and for
# subsequent renewals.
server {
    listen 80;
    listen [::]:80;
    server_name fleet-api.sage.delivery;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
