# This listener is reachable only through the public 443 SNI router. The public
# service certificate and the private device CA have separate lifecycles.
server {
    listen 127.0.0.1:9443 ssl;
    server_name fleet-api.sage.delivery;

    ssl_certificate /etc/letsencrypt/live/fleet-api.sage.delivery/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleet-api.sage.delivery/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FleetTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # "optional" requests and validates a client certificate during TLS, while
    # still allowing pre-certificate enrollment and human bearer-admin calls.
    # The /v1/device/ location below is the fail-closed enforcement point.
    ssl_client_certificate /var/lib/sage-fleet-authority/fleet-ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 1;

    client_max_body_size 256k;

    location = /healthz {
        include /etc/nginx/snippets/fleet-authority-proxy.conf;
        include /etc/nginx/snippets/fleet-clear-client-identity.conf;
    }

    # Claim and completion necessarily run before a device certificate exists.
    # Their setup-secret and proof-of-possession checks live in the authority.
    location ^~ /v1/enrollments/ {
        limit_req zone=fleet_enrollment burst=5 nodelay;
        include /etc/nginx/snippets/fleet-authority-proxy.conf;
        include /etc/nginx/snippets/fleet-clear-client-identity.conf;
    }

    location ^~ /v1/admin/ {
        limit_req zone=fleet_admin burst=30 nodelay;
        include /etc/nginx/snippets/fleet-authority-proxy.conf;
        include /etc/nginx/snippets/fleet-clear-client-identity.conf;
    }

    location ^~ /v1/device/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        limit_req zone=fleet_device burst=20 nodelay;
        include /etc/nginx/snippets/fleet-authority-proxy.conf;
        proxy_set_header X-Fleet-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-Fleet-Client-Cert-Fingerprint $fleet_client_sha256;
    }

    location / {
        return 404;
    }
}
