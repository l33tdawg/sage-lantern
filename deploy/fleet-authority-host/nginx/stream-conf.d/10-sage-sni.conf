# Stage 2: TLS remains end-to-end to the call relay. Fleet TLS is terminated by
# the loopback-only nginx listener on 9443 so it can verify device certificates.
map $ssl_preread_server_name $sage_tls_upstream {
    hostnames;
    call.sage.delivery      127.0.0.1:8444;
    fleet-api.sage.delivery 127.0.0.1:9443;
    default                 127.0.0.1:9;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_connect_timeout 3s;
    proxy_timeout 1h;
    proxy_pass $sage_tls_upstream;
}
