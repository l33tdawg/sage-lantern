# Stage 1: preserve call.sage.delivery TLS while the fleet certificate is being
# obtained over HTTP. Unknown SNI, including fleet-api, goes to a closed local
# port and fails closed.
map $ssl_preread_server_name $sage_tls_upstream {
    hostnames;
    call.sage.delivery      127.0.0.1:8444;
    fleet-api.sage.delivery 127.0.0.1:9;
    default                 127.0.0.1:9;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_connect_timeout 3s;
    proxy_timeout 1h;
    proxy_pass $sage_tls_upstream;
}
