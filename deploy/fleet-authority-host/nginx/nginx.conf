user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

# Ubuntu packages the stream module as a dynamic module. Install
# libnginx-mod-stream and retain the modules-enabled include.
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

stream {
    include /etc/nginx/stream-conf.d/*.conf;
}

http {
    js_import fleet_tls from /etc/nginx/njs/fleet_tls.js;
    js_set $fleet_client_sha256 fleet_tls.clientFingerprint;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent client_verify="$ssl_client_verify" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
