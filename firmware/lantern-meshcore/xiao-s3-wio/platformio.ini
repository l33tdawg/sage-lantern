; Copy beside upstream variants/*/platformio.ini after applying pinned-r5.patch.
; Headless USB companion for the XIAO ESP32S3 + Wio-SX1262 B2B kit.
[env:lantern_xiao_s3_wio_usb]
extends = Xiao_S3_WIO
board_build.partitions = default_8MB.csv
; Remove the inherited frequency definition before supplying the Lantern default.
build_unflags = -D LORA_FREQ=869.618
build_flags =
  ${Xiao_S3_WIO.build_flags}
  -D LORA_FREQ=917.375
  -D LORA_CR=5
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
  '-D FIRMWARE_VERSION="v1.17.1-r5-xiao1"'
  "-D ALLOWED_REPEAT_FREQ_RANGE={917375,917375}"
build_src_filter = ${Xiao_S3_WIO.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Xiao_S3_WIO.lib_deps}
  densaugeo/base64 @ ~1.4.0
