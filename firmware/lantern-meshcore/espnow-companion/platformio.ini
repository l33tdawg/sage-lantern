; ESP-NOW as the mesh radio, on a Heltec V4's ESP32-S3.
;
; Why this exists: LoRa is a low-rate, long-range PHY and no amount of transmit
; power changes that - power buys range, not throughput. ESP-NOW is
; 802.11-derived 2.4 GHz with a 250-byte frame limit, so it trades range for a
; room-and-garden lane at GPRS-class-or-better rates. MeshCore already ships
; ESP-NOW as a mesh radio (variants/generic_espnow) and as a repeater bridge
; (src/helpers/bridges/ESPNowBridge); this is the same radio on this board, with
; its display, sensors and host interface intact.
;
; The variant include goes FIRST so `#include "target.h"` from the example
; resolves to this target, not the LoRa one.
;
; Install into a MeshCore checkout as variants/heltec_v4_espnow/ and build with:
;   pio run -e heltec_v4_espnow_companion_radio_usb

[heltec_v4_espnow]
extends = heltec_v4_oled
build_flags =
  -I variants/heltec_v4_espnow
  ${heltec_v4_oled.build_flags}
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/esp32/ESPNOWRadio.cpp>

[env:heltec_v4_espnow_companion_radio_usb]
extends = heltec_v4_espnow
build_flags =
  ${heltec_v4_espnow.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D ENABLE_USB_INTERFACE
build_src_filter = ${heltec_v4_espnow.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${heltec_v4_espnow.lib_deps}
  densaugeo/base64 @ ~1.4.0
