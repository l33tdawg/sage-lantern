# REVIEW ONLY: future root-owned @ubuntu drop-in; no live installation.
[Unit]
# Suppress the stock failure-triggered shutdown/extensions-disable transaction.
OnFailure=

[Service]
ExecStart=
ExecStart=/usr/bin/python3 -I /usr/local/libexec/sage-lantern-guarded-session-bridge
Type=notify
NotifyAccess=main
Restart=no
# The bridge deliberately remains held after root EOF/failure.
TimeoutStartSec=infinity
LimitCORE=0
