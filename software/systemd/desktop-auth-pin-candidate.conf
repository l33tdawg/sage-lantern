# REVIEW ONLY: matched to the staged broker unit, not a generic additive install.
[Service]
RuntimeDirectory=sage-lantern-desktop-auth
RuntimeDirectoryMode=0700
ExecStart=
ExecStart=/opt/sage-lantern/venv/bin/python /usr/local/libexec/sage-lantern-device-auth --state-dir /var/lib/sage-lantern/device-lock --idle-seconds 120 --operator-key /var/lib/sage-lantern/sage-personal/agent.key --setup-marker /etc/sage-lantern-vault-setup.enabled --desktop-socket /run/sage-lantern-desktop-auth/control.sock
