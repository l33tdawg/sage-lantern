[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-fleet-authority"
version = "0.1.0"
description = "Isolated enrollment and observation authority for SAGE Lantern fleets"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
sage-fleet-authority = "fleet_authority.main:run"
sage-fleet-authority-reissue-client-cert = "fleet_authority.reissue:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
