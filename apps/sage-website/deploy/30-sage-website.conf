# Static public SAGE website. Relay and Fleet routes retain their own backends.
server {
    listen 80;
    listen [::]:80;
    server_name sage.ngo;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://sage.ngo$request_uri; }
}
server {
    listen 127.0.0.1:9444 ssl;
    server_name sage.ngo;
    ssl_certificate /etc/letsencrypt/live/sage.ngo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sage.ngo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SageWebsiteTLS:1m;
    ssl_session_tickets off;
    root /var/www/sage-website/current;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    location / { try_files $uri $uri/ =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ^~ /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~ /\. { deny all; }
}
