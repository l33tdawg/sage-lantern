# Static public SAGE website. Relay and Fleet routes retain their own backends.

# Cache policy in one place. Pages and route payloads must revalidate;
# content-hashed assets and images may be held. A single map plus a single
# add_header below matters: a location-level add_header cancels inherited
# headers, which is how `/` lost its security headers and `/commons/` lost
# its cache directive.
map $uri $sage_cache_control {
    default             "no-cache";
    ~^/_next/static/    "public, max-age=31536000, immutable";
    ~^/(images|brand)/  "public, max-age=604800";
}

server {
    listen 80;
    listen [::]:80;
    server_name sage.ngo;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://sage.ngo$request_uri; }
}
server {
    listen 127.0.0.1:9444 ssl;
    server_name sage.ngo;
    ssl_certificate /etc/letsencrypt/live/sage.ngo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sage.ngo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SageWebsiteTLS:1m;
    ssl_session_tickets off;
    root /var/www/sage-website/current;
    index index.html;
    autoindex off;
    # Emit relative Location headers: the origin listens on 127.0.0.1:9444
    # behind Cloudflare, and an absolute redirect would leak that port.
    absolute_redirect off;
    add_header Cache-Control $sage_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # A stray trailing slash on a route payload (/hardware/index.txt/) 404s;
    # send the visitor to the page instead. The payload without the slash must
    # keep serving: the client router fetches it for soft navigation.
    location ~ ^/(.+/)index\.txt/$ { return 301 /$1; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
