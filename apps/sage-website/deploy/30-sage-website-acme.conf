# SAGE website certificate preparation. Existing relay routes are untouched.
server {
    listen 80;
    listen [::]:80;
    server_name sage.ngo;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
